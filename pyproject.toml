[project]
name = "bhairav"
version = "0.8.0"
description = "BHAIRAV - Behavioral Hazard Analysis & Intelligent Real-time Action Vigilance: vision pipeline, behavior alerts, evidence & live API (Phases 1-8)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = ["ultralytics>=8.2"]   # brings PyTorch + ByteTrack for real detection/tracking
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Safe subset only: E402 (sys.path-before-imports) is an intentional
# repo convention in scripts/ and tests/ and stays excluded.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
