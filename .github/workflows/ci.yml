name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install "ruff==0.9.10"
      - name: Ruff lint (safe subset E4/E7/E9/F; E402 = intentional sys.path pattern)
        run: python -m ruff check src scripts tests
      - name: Compile all sources
        run: python -m compileall -q src scripts tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless cv2 runtime libs (libGL, glib)
        run: |-
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install core + dev deps (skip heavy ML tier)
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.2.6" "opencv-python==4.12.0.88" "PyYAML==6.0.3"             "fastapi==0.141.1" "uvicorn==0.52.1" "websockets==17.0.1"             "cryptography==50.0.0" "pytest==9.1.1" "httpx==0.28.1"
      - name: Import + version sanity
        run: python -c "import sys; sys.path.insert(0,'src'); import bhairav; print('bhairav', bhairav.__version__)"
      - name: Run test suite (unit + gated PG tests skip without a database)
        run: python -m pytest -q

  test-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bhairav_test
          POSTGRES_USER: bhairav
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bhairav -d bhairav_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BHAIRAV_TEST_DB_URL: postgresql://bhairav:test@localhost:5432/bhairav_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core + psycopg
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.2.6" "opencv-python==4.12.0.88" "PyYAML==6.0.3"             "fastapi==0.141.1" "uvicorn==0.52.1" "websockets==17.0.1"             "cryptography==50.0.0" "psycopg[binary]==3.3.4" "pytest==9.1.1"             "httpx==0.28.1"
      - name: Install postgres client (pg_dump/pg_restore for backup tests)
        run: |-
          sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run PostgreSQL integration tests
        run: python -m pytest -q tests/test_evidence_pg.py tests/test_audit_pg.py                              tests/test_users_plates_pg.py tests/test_backups_pg.py
      - name: Run full suite in PostgreSQL mode
        run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned deps (all tiers)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: pip-audit (CVE scan)
        run: python -m pip_audit

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless cv2 runtime libs (libGL, glib)
        run: |-
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.2.6" "opencv-python==4.12.0.88" "PyYAML==6.0.3"             "fastapi==0.141.1" "uvicorn==0.52.1" "websockets==17.0.1"             "cryptography==50.0.0" "pytest==9.1.1" "httpx==0.28.1"
      - name: Validation harness on the deterministic scene (regression gate)
        run: python scripts/validate_footage.py --source blob --max-frames 90                --threshold "frames>=90,alerts_total>=1,detections_total>=1"
      - name: Boot the server and probe endpoints
        run: |
          python scripts/serve.py --port 8123 > /tmp/bhairav-smoke.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8123/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/health | grep -q '"status":"ok"'
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8123/auth/login             -H "Content-Type: application/json"             -d '{"username":"viewer","password":"viewer123"}' | python -c "import sys,json; print(json.load(sys.stdin)['token'])")
          curl -sf http://127.0.0.1:8123/api/evidence -H "Authorization: Bearer $TOKEN" > /dev/null
          curl -sf -o /dev/null http://127.0.0.1:8123/dashboard/
          kill $PID 2>/dev/null || true
          echo "SMOKE OK"
