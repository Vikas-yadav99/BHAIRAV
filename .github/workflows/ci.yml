name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core + dev deps (skip heavy ML tier)
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.2.6" "opencv-python==4.12.0" "PyYAML==6.0.3" \
            "fastapi==0.141.1" "uvicorn==0.52.1" "websockets==17.0.1" \
            "cryptography==50.0.0" "pytest==9.1.1"
      - name: Run test suite
        run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned deps (all tiers)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: pip-audit (CVE scan)
        run: python -m pip_audit
