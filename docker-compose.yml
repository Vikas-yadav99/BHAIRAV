# BHAIRAV City Safety System — Production Stack
# Usage:
#   docker compose up -d          # start everything
#   docker compose logs -f        # watch logs
#   docker compose down           # stop

version: "3.9"

services:
  # ── Main BHAIRAV Server ──────────────────────────────────────────
  bhairav:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhairav-server
    ports:
      - "8000:8000"
    volumes:
      - bhairav-data:/app/output
      - bhairav-config:/app/config
    environment:
      - BHAIRAV_SECRET=${BHAIRAV_SECRET:-change-me-in-production}
      - BHAIRAV_CORS_ORIGINS=${BHAIRAV_CORS_ORIGINS:-}
      - BHAIRAV_LOG_LEVEL=${BHAIRAV_LOG_LEVEL:-INFO}
      - BHAIRAV_RETENTION_DAYS=${BHAIRAV_RETENTION_DAYS:-30}
      - BHAIRAV_SMS_GATEWAY=${BHAIRAV_SMS_GATEWAY:-}
      - BHAIRAV_TWILIO_SID=${BHAIRAV_TWILIO_SID:-}
      - BHAIRAV_TWILIO_TOKEN=${BHAIRAV_TWILIO_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  # ── Redis for caching + rate limiting ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bhairav-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Prometheus metrics exporter (optional) ───────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: bhairav-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped
    profiles:
      - monitoring

  # ── Grafana dashboards (optional) ───────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: bhairav-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  bhairav-data:
  bhairav-config:
  redis-data:
  prometheus-data:
  grafana-data:
