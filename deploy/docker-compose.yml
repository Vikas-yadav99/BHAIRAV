# BHAIRAV - production stack: HA app replicas + Redis + PostgreSQL + nginx (TLS)
#
#   docker compose -f deploy/docker-compose.yml up -d --scale app=2
#
# First time (TLS):  ./deploy/nginx/generate_certs.sh  then place certs in ./certs/
# Secrets: set in a .env file next to this compose file:
#   BHAIRAV_SECRET=<long random>            # admin token signing secret
#   BHAIRAV_EVIDENCE_KEY=<base64 32 bytes>  # AES-256 key for evidence at rest
#
# Phase 8 HA (M3): every persistent store lives in the shared `db` service -
# evidence (media as BYTEA), the hash-chained audit log, users, and the plate
# watchlist. Replicas share state with no shared filesystem, so `--scale app=N`
# is safe. nginx load-balances across replicas with ip_hash (WebSocket
# stickiness). To stay on the file store, remove DATABASE_URL below and the
# `db` service (single replica only).
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bhairav:latest
    restart: unless-stopped
    # Phase 8 HA: run N replicas behind nginx (docker compose up --scale app=N).
    # All state lives in PostgreSQL, so replicas are stateless beyond the
    # per-process live hub (a client is pinned to one replica by ip_hash).
    deploy:
      replicas: 2
    environment:
      BHAIRAV_SECRET: ${BHAIRAV_SECRET:?set BHAIRAV_SECRET in .env}
      BHAIRAV_EVIDENCE_KEY: ${BHAIRAV_EVIDENCE_KEY:?set BHAIRAV_EVIDENCE_KEY in .env}
      BHAIRAV_ALLOW_DEFAULT_PASSWORDS: "0"
      # Phase 9 M3: shared scrape token for /metrics (same value in
      # deploy/prometheus-token). Optional - admin login tokens work too.
      BHAIRAV_METRICS_TOKEN: ${BHAIRAV_METRICS_TOKEN:-}
      # PostgreSQL (Phase 8): evidence + audit + users + plate watchlist.
      # Remove to stay on the file store (single replica only).
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://bhairav:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/bhairav
    volumes:
      - bhairav-data:/data
      - ./config.override.yaml:/app/config.yaml:ro   # optional: per-deploy config
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [bhairav]
    # uncomment when the source is an RTSP camera
    # command: ["--source", "rtsp://user:pass@cam-ip:554/stream1", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks: [bhairav]

  redis:  # Phase 19: HA clustering + session store
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [bhairav]

  db:   # PostgreSQL evidence store (Phase 8)
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bhairav
      POSTGRES_USER: bhairav
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhairav -d bhairav"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [bhairav]

  # Phase 9 M3 - scheduled PostgreSQL logical backups (every 6h) with
  # retention pruning + a post-write verify; files land on the backups
  # volume and are listed/downloadable via /api/ops/backups (admin).
  backup:
    image: bhairav:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[backup] $(date -u) starting";
          python scripts/backup_db.py --url "$$DATABASE_URL" --dir /backups               --retention 14 --verify || echo "[backup] FAILED (will retry)";
          sleep 21600;
        done
    environment:
      DATABASE_URL: postgresql://bhairav:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/bhairav
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [bhairav]

  # Phase 9 M3 - metrics scraping + dashboards (optional but recommended).
  # First create the scrape token file (no trailing newline!):
  #   printf '%s' "$BHAIRAV_METRICS_TOKEN" > deploy/prometheus-token
  # and set the same BHAIRAV_METRICS_TOKEN on the app service below.
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-token:/etc/prometheus/bhairav-token:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - app
    networks: [bhairav]

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - graf-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [bhairav]

volumes:
  bhairav-data:
  redis-data:
  pg-data:
  backups:
  prom-data:
  graf-data:

networks:
  bhairav:
    driver: bridge
