# BHAIRAV - production stack: app + nginx (TLS termination)
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# First time (TLS):  ./deploy/nginx/generate_certs.sh  then place certs in ./certs/
# Secrets: set in a .env file next to this compose file:
#   BHAIRAV_SECRET=<long random>            # admin token signing secret
#   BHAIRAV_EVIDENCE_KEY=<base64 32 bytes>  # AES-256 key for evidence at rest
#
# NOTE on storage: today all state (users, audit, evidence, plates) is
# file-based and lives on the bhairav-data volume. PostgreSQL is a roadmap
# milestone; the commented `db` service shows the shape of that migration.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bhairav:latest
    restart: unless-stopped
    environment:
      BHAIRAV_SECRET: ${BHAIRAV_SECRET:?set BHAIRAV_SECRET in .env}
      BHAIRAV_EVIDENCE_KEY: ${BHAIRAV_EVIDENCE_KEY:?set BHAIRAV_EVIDENCE_KEY in .env}
      BHAIRAV_ALLOW_DEFAULT_PASSWORDS: "0"
    volumes:
      - bhairav-data:/data
      - ./config.override.yaml:/app/config.yaml:ro   # optional: per-deploy config
    expose:
      - "8000"
    networks: [bhairav]
    # uncomment when the source is an RTSP camera
    # command: ["--source", "rtsp://user:pass@cam-ip:554/stream1", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks: [bhairav]

  # db:  # PostgreSQL is a ROADMAP milestone (storage is file-based today)
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: bhairav
  #     POSTGRES_USER: bhairav
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  #   volumes: [pg-data:/var/lib/postgresql/data]
  #   networks: [bhairav]

volumes:
  bhairav-data:
  # pg-data:

networks:
  bhairav:
    driver: bridge
