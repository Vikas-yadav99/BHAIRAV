# BHAIRAV - nginx reverse proxy: TLS termination + rate limits in front of uvicorn
worker_processes auto;

events { worker_connections 1024; }

http {
    # hide server banner, block the app from being probed on odd hosts
    server_tokens off;

    # upstream = the containerized uvicorn app replicas (Phase 8 HA).
    # With --scale app=N, compose DNS resolves `app` to all replica IPs and
    # nginx round-robins between them. ip_hash pins a client to one replica,
    # which keeps its live WebSocket channel consistent across reconnects.
    upstream bhairav_app {
        ip_hash;
        server app:8000;
        keepalive 16;
    }

    # ---- HTTP -> HTTPS redirect (except ACME challenges if you use certbot) ----
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/bhairav.crt;
        ssl_certificate_key /etc/nginx/certs/bhairav.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # dashboard + API + websocket live stream
        location / {
            proxy_pass http://bhairav_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;

            # websocket upgrade (live stream)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # belt-and-braces: cap request bodies (login/uploads) at 8 MB
        client_max_body_size 8m;

        # modest rate limit at the edge on top of the app's login limiter
        limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://bhairav_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
