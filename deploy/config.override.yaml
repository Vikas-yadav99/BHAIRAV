# Per-deployment overrides merged by mounting over /app/config.yaml.
# Copy this file, edit values, and keep it OUT of git (it holds secrets).
backend:
  host: 0.0.0.0
  port: 8000
  secret: CHANGE_ME_LONG_RANDOM     # overridden by BHAIRAV_SECRET env in compose
  users_file: /data/output/users.json
  webhook_url: null                  # e.g. your Slack/Teams webhook for red alerts
  # PostgreSQL evidence store (Phase 8): usually left null because compose
  # sets DATABASE_URL; set it here (or via $BHAIRAV_DB_URL) if running bare.
  db: null
evidence:
  dir: /data/evidence
  encrypt: true

# the input source is chosen with the compose `command` (e.g. an RTSP URL or
# video file); the synthetic scene is only for demos. See docker-compose.yml.
