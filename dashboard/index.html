<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#00e5ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="BHAIRAV Command Center - Real-time surveillance intelligence">
  <link rel="manifest" href="/dashboard/manifest.json">
  <link rel="apple-touch-icon" href="/dashboard/icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHAIRAV Command Center</title>
<!-- vendored locally (no CDN / supply-chain dependency): dashboard/vendor/ -->
<script crossorigin src="vendor/react.production.min.js"></script>
<script crossorigin src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<style>
:root {
  --bg: #0b1120; --panel: #0f172a; --border: #1e293b; --border2: #16213a;
  --text: #e2e8f0; --muted: #64748b; --dim: #94a3b8;
  --green: #22c55e; --yellow: #eab308; --orange: #f97316; --red: #ef4444; --cyan: #22d3ee;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#root { min-height: 100vh; display: flex; flex-direction: column; }
a { color: var(--cyan); }
button { font: inherit; cursor: pointer; }
input, select { font: inherit; }

/* ---------- login ---------- */
.login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  padding: 36px 32px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.login-card h1 { font-size: 22px; margin-bottom: 4px; }
.login-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
.field { margin-bottom: 14px; }
.field label { display: block; color: var(--dim); font-size: 12px; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 6px; }
.field input, .field select { width: 100%; background: #0d1526; color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.field select option { background: #0d1526; }
.btn { border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; font-size: 14px; }
.btn-primary { background: var(--cyan); color: #06222b; width: 100%; }
.btn-primary:hover { filter: brightness(1.1); }
.btn-ghost { background: #1e293b; color: var(--text); }
.btn-ghost:hover { background: #263449; }
.err { color: var(--red); font-size: 13px; margin-bottom: 12px; min-height: 18px; }

/* ---------- app shell ---------- */
.topbar { display: flex; align-items: center; gap: 16px; padding: 0 20px; height: 56px;
  background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
.brand { font-weight: 800; letter-spacing: .5px; font-size: 16px; white-space: nowrap; }
.brand span { color: var(--cyan); }
.tabs { display: flex; gap: 4px; margin-left: 8px; }
.tab { background: none; border: none; color: var(--muted); padding: 8px 14px; border-radius: 8px;
  font-weight: 600; font-size: 14px; transition: all .15s; }
.tab:hover { color: var(--text); background: #16213a; }
.tab.active { color: var(--cyan); background: #0d1526; }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px;
  border-radius: 999px; border: 1px solid var(--border); color: var(--dim); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.6s infinite; }
.dot.idle { background: var(--muted); }
@keyframes pulse { 50% { opacity: .4; } }
.user { color: var(--dim); font-size: 13px; }
.logout { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px;
  padding: 6px 12px; font-size: 13px; }
.logout:hover { color: var(--red); border-color: var(--red); }
main { flex: 1; padding: 20px; max-width: 1400px; width: 100%; margin: 0 auto; }

/* ---------- live wall ---------- */
.live-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .live-grid { grid-template-columns: 1fr; } }
.stream-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.stream-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-bottom: 1px solid var(--border2); font-size: 13px; color: var(--dim); }
.stream-head .cam { font-weight: 700; color: var(--text); }
.stream-body { position: relative; background: #000; aspect-ratio: 16/9; }
.stream-body canvas { width: 100%; height: 100%; display: block; }
.stream-status { position: absolute; top: 10px; right: 10px; font-size: 11px; padding: 3px 8px;
  border-radius: 6px; background: rgba(0,0,0,.6); color: var(--muted); }
.hud-row { display: flex; gap: 14px; padding: 10px 14px; border-top: 1px solid var(--border2);
  font-size: 12px; color: var(--dim); flex-wrap: wrap; }
.hud-row b { color: var(--text); }

/* ---------- alert feed ---------- */
.feed { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.feed-head { padding: 10px 14px; border-bottom: 1px solid var(--border2); font-size: 13px; font-weight: 700; color: var(--dim); }
.feed-list { max-height: 520px; overflow-y: auto; }
.feed-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px;
  border-bottom: 1px solid var(--border2); font-size: 12px; animation: slidein .2s; }
@keyframes slidein { from { opacity: 0; transform: translateY(-6px); } }
.feed-item .sev { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.feed-item .msg { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-item .rule { color: var(--cyan); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
.feed-item .ts { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
.feed-empty { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }

/* ---------- evidence ---------- */
.search-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.search-row input[type=text] { flex: 1; min-width: 200px; background: var(--panel); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
.search-row select { background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 10px; }
.ev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.ev-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  cursor: pointer; transition: transform .15s, border-color .15s; }
.ev-card:hover { transform: translateY(-3px); border-color: #334155; }
.ev-card img { width: 100%; height: 150px; object-fit: cover; display: block; background: #000; }
.ev-body { padding: 12px; }
.ev-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.sev-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .5px; }
.ev-rule { font-size: 13px; font-weight: 700; }
.ev-meta { color: var(--muted); font-size: 12px; }
.ev-msg { color: var(--dim); font-size: 12px; margin-top: 6px; line-height: 1.4; }
.ev-flag { font-size: 11px; color: var(--dim); margin-top: 4px; }
.count { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

/* ---------- face search ---------- */
.search-grid { display: grid; grid-template-columns: 340px 1fr; gap: 14px; align-items: start; margin-bottom: 18px; }
@media (max-width: 900px) { .search-grid { grid-template-columns: 1fr; } .search-grid .ev-card[style*="span 2"] { grid-column: auto !important; } }
.result-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.result-card { display: flex; align-items: center; gap: 10px; background: #0d1526; border: 1px solid var(--border2);
  border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.result-card .sev-badge { flex-shrink: 0; }
.sim-bar { flex: 1; height: 6px; background: #1e293b; border-radius: 999px; overflow: hidden; min-width: 60px; }
.sim-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green)); }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(4,8,16,.8); display: flex; align-items: center;
  justify-content: center; z-index: 50; padding: 20px; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; max-width: 860px;
  width: 100%; max-height: 92vh; overflow-y: auto; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px;
  border-bottom: 1px solid var(--border2); }
.modal-head .title { font-weight: 700; }
.modal-close { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 20px; line-height: 1; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 18px; }
.modal-body img { width: 100%; border-radius: 8px; }
.modal-body video { width: 100%; border-radius: 8px; background: #000; }
.meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
.meta-cell { background: #0d1526; border: 1px solid var(--border2); border-radius: 8px; padding: 8px 10px; }
.meta-cell .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
.meta-cell .v { color: var(--text); font-size: 13px; margin-top: 2px; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

/* ---------- audit ---------- */
.audit-ok { display: inline-flex; align-items: center; gap: 8px; background: #052e16; color: var(--green);
  border: 1px solid #14532d; padding: 8px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
.audit-bad { display: inline-flex; align-items: center; gap: 8px; background: #450a0a; color: var(--red);
  border: 1px solid #7f1d1d; padding: 8px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
table.tbl th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase;
  letter-spacing: 1px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: #0d1526; }
table.tbl td { padding: 9px 14px; border-bottom: 1px solid var(--border2); color: var(--text); }
table.tbl td.muted { color: var(--muted); }
.hash { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); }

/* ---------- status ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.stat-card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.stat-card .v { font-size: 26px; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat-card .s { color: var(--dim); font-size: 12px; margin-top: 4px; }
.sev-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); margin: 4px 0; }
.sev-row .bar { flex: 1; height: 8px; background: #0d1526; border-radius: 99px; overflow: hidden; }
.sev-row .fill { height: 100%; border-radius: 99px; }
.stat-col { margin-top: 22px; }
.stat-col h3 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.audit-ok, .audit-bad { margin-bottom: 0; }

/* ---------- users ---------- */
.user-form { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.user-form input, .user-form select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
.lock-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 3px 8px; font-size: 11px; }
.lock-btn:hover { color: var(--yellow); border-color: var(--yellow); }
.del-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 3px 8px; font-size: 11px; }
.del-btn:hover { color: var(--red); border-color: var(--red); }

/* ---------- evidence notes ---------- */
.note-box { margin-top: 16px; border-top: 1px solid var(--border2); padding-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.note-box .meta-cell { min-width: 150px; margin-top: 0; }
.note-box input { flex: 1; min-width: 180px; background: #0d1526; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
.note-item { flex-basis: 100%; color: var(--dim); font-size: 12px; padding: 6px 10px; background: #0d1526; border-radius: 8px; }
.note-item b { color: var(--text); }
.note-item .muted { color: var(--muted); }

/* ---------- misc ---------- */
.loading { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
.chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .5px; }

/* Phase 9 M5 - public monitor */
.public-wrap { min-height: 100vh; display: flex; flex-direction: column; }
.public-head { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--border); background: rgba(10, 15, 30, .85); }
.public-grid { display: grid; gap: 14px; }
.public-card { background: #0d1526; border: 1px solid var(--border); border-radius: 12px; padding: 10px; overflow: hidden; }
.public-card img { width: 100%; display: block; border-radius: 8px; }
.public-cam { font-size: 12px; font-weight: 700; letter-spacing: .5px; color: var(--cyan); margin-bottom: 8px; }
.dot.dead { background: #f87171; }

/* Phase 12 - analytics tab */
.heatmap-grid { display: grid; gap: 1px; background: var(--border2); border-radius: 8px; overflow: hidden; max-width: 600px; }
.heatmap-cell { width: 100%; aspect-ratio: 1; }
.analytics-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.analytics-panel { background: var(--panel); border: 1px solid var(--border2); border-radius: 10px; padding: 16px; min-width: 280px; flex: 1; }
.analytics-panel h3 { margin: 0 0 12px; font-size: 14px; color: var(--cyan); }
.forecast-trend { font-size: 24px; font-weight: 800; margin: 4px 0; }
.forecast-trend.rising { color: #ff6b6b; }
.forecast-trend.falling { color: #51cf66; }
.forecast-trend.stable { color: var(--muted); }
.trend-bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; }
.trend-bar .bar { height: 6px; border-radius: 3px; background: var(--cyan); min-width: 2px; }
.sev-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.sev-red { background: #ff6b6b; } .sev-orange { background: #ffa94d; } .sev-yellow { background: #ffd43b; } .sev-green { background: #51cf66; }
/* Phase 9 M4 - re-id tab */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.trail { display: flex; flex-wrap: wrap; gap: 8px; }
.trail-step { background: #0d1526; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; min-width: 130px; }
.trail-cam { color: var(--green); font-size: 13px; font-weight: 700; }
.sighting-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.sighting { background: #0d1526; border: 1px solid var(--border); border-radius: 10px; padding: 8px; overflow: hidden; }
.sighting img { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; display: block; }
.sighting-thumb { width: 100%; height: 90px; border-radius: 6px; background: repeating-linear-gradient(45deg, #1e293b, #1e293b 8px, #0f172a 8px, #0f172a 16px); }
.desc-search { display: flex; gap: 8px; margin: 14px 0 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const SEV_COLORS = { green: '#22c55e', yellow: '#eab308', orange: '#f97316', red: '#ef4444' };
const RULES = ['loitering','zone_crossing','crowd_density','fall','fight','chase','trespass','anomaly'];

function sevStyle(s) { return { background: (SEV_COLORS[s]||'#94a3b8') + '22', color: SEV_COLORS[s]||'#94a3b8', border: '1px solid ' + (SEV_COLORS[s]||'#94a3b8') + '66' }; }

function api(token) {
  const base = {
    'Content-Type': 'application/json',
    ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
  };
  return {
    get: async (path) => {
      const r = await fetch(path, { headers: base });
      if (r.status === 401) throw new Error('unauthorized');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    },
    login: async (username, password) => {
      const r = await fetch('/auth/login', { method: 'POST', headers: base, body: JSON.stringify({ username, password }) });
      if (!r.ok) throw new Error('login failed');
      return r.json();
    },
  };
}

// Authenticated blob-URL loading (img/a tags can't send the bearer header)
const snapCache = {};
const SNAP_CACHE_MAX = 300;   // evict oldest to bound memory across long replay sessions
async function snapUrl(token, eventId) {
  if (snapCache[eventId]) return snapCache[eventId];
  try {
    const r = await fetch('/api/evidence/' + eventId + '/snapshot', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) return null;
    const u = URL.createObjectURL(await r.blob());
    const keys = Object.keys(snapCache);
    if (keys.length >= SNAP_CACHE_MAX) { URL.revokeObjectURL(snapCache[keys[0]]); delete snapCache[keys[0]]; }
    snapCache[eventId] = u;
    return u;
  } catch (_) { return null; }
}
function SnapImg({ token, eventId }) {
  const [url, setUrl] = useState(null);
  useEffect(() => { let live = true; snapUrl(token, eventId).then(u => { if (live) setUrl(u); }); return () => { live = false; }; }, [token, eventId]);
  return <img src={url} alt="" />;
}
async function downloadClip(token, ev) {
  try {
    const r = await fetch('/api/evidence/' + ev.event_id + '/clip', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const u = URL.createObjectURL(await r.blob());
    const a = document.createElement('a');
    a.href = u; a.download = 'bhairav_' + ev.event_id + '.mp4';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 5000);
  } catch (_) { alert('Clip download failed (operator+ required, clip may be empty).'); }
}

// ---------- Login ----------
function Login({ onLogin }) {
  const [username, setUsername] = useState('admin');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  async function submit(e) {
    e.preventDefault();
    setBusy(true); setErr('');
    try {
      const res = await api().login(username, password);
      onLogin(res.token, res.role, res.username);
    } catch (ex) {
      setErr('Invalid username or password.');
    } finally { setBusy(false); }
  }
  return (
    <div className="login-wrap">
      <form className="login-card" onSubmit={submit}>
        <h1>🛰 BHAIRAV <span style={{color:'var(--cyan)'}}>Command Center</span></h1>
        <div className="sub">Behavioral Hazard Analysis &amp; Intelligent Real-time Action Vigilance</div>
        <div className="field">
          <label>Username</label>
          <input value={username} onChange={e => setUsername(e.target.value)} autoComplete="username" />
        </div>
        <div className="field">
          <label>Password</label>
          <input type="password" value={password} onChange={e => setPassword(e.target.value)} autoComplete="current-password" />
        </div>
        <div className="err">{err}</div>
        <button className="btn btn-primary" disabled={busy}>{busy ? 'Signing in…' : 'Sign in'}</button>
        <div className="sub" style={{marginTop:16, textAlign:'center', lineHeight:1.6}}>
          demo accounts:<br/>admin / admin123 · operator / operator123<br/>analyst / analyst123 · viewer / viewer123 · police / police123
        </div>
        <div className="sub" style={{marginTop:8, textAlign:'center'}}>
          🔒 read-only <b>public monitor</b>: use the ?public= link provided by the operator
        </div>
      </form>
    </div>
  );
}

// ---------- Live tab ----------
function drawOverlay(canvas, img, imgW, imgH, tracks, poses, alerts, sevByTrack) {
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = imgW * dpr; canvas.height = imgH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, imgW, imgH);
  const sx = canvas.clientWidth / imgW, sy = canvas.clientHeight / imgH;
  ctx.scale(sx, sy);
  if (img && img.complete) ctx.drawImage(img, 0, 0, imgW, imgH);   // the actual frame
  // tracks
  for (const t of tracks || []) {
    const [x1, y1, x2, y2] = t.bbox;
    const col = t.label === 'person' ? '#22d3ee' : '#f59e0b';
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    ctx.fillStyle = 'rgba(15,23,42,.85)';
    ctx.font = '11px system-ui';
    const tag = `#${t.id} ${t.label}`;
    const tw = ctx.measureText(tag).width + 8;
    ctx.fillRect(x1, Math.max(0, y1 - 16), tw, 16);
    ctx.fillStyle = col;
    ctx.fillText(tag, x1 + 4, Math.max(11, y1 - 5));
  }
  // poses (stick figures)
  for (const p of poses || []) {
    const P = p.kps || [];
    const pt = i => (P[i] && P[i][2] > 0.1) ? { x: P[i][0] * imgW, y: P[i][1] * imgH } : null;
    const bones = [[0,5],[0,6],[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
    ctx.strokeStyle = '#fb923c'; ctx.lineWidth = 1.5;
    for (const [a, b] of bones) { const pa = pt(a), pb = pt(b); if (pa && pb) { ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke(); } }
    ctx.fillStyle = '#fb923c';
    for (let i = 0; i < P.length; i++) { const q = pt(i); if (q) { ctx.beginPath(); ctx.arc(q.x, q.y, 2, 0, 7); ctx.fill(); } }
  }
  // alert tags on tracks
  for (const [tid, sev] of Object.entries(sevByTrack || {})) {
    const t = (tracks || []).find(x => String(x.id) === String(tid));
    if (!t) continue;
    const [x1, y1] = t.bbox;
    ctx.fillStyle = SEV_COLORS[sev] || '#ef4444';
    ctx.font = 'bold 12px system-ui';
    const label = sev.toUpperCase();
    const tw = ctx.measureText(label).width + 10;
    ctx.fillRect(x1, Math.max(0, y1 - 32), tw, 18);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x1 + 5, Math.max(13, y1 - 18));
  }
}

function LiveTab({ token }) {
  const canvasRef = useRef(null);
  const [frame, setFrame] = useState(null);   // {jpeg, tracks, poses, alerts}
  const [status, setStatus] = useState('connecting');
  const [feed, setFeed] = useState([]);
  const [hud, setHud] = useState({ tracks: 0, persons: 0, vehicles: 0, fps: 0, alerts: 0 });
  const [recent, setRecent] = useState([]);
  const [connected, setConnected] = useState(false);
  const [cams, setCams] = useState([]);       // Phase 8 M2: camera registry
  const [cam, setCam] = useState('');         // selected camera id ('' = all)
  const fpsRef = useRef({ t: 0, n: 0 });

  // camera registry from /api/status (default to the first camera)
  useEffect(() => {
    api(token).get('/api/status').then(d => {
      const list = d.cameras || [];
      setCams(list);
      setCam(c => c || (list.length ? list[0].id : ''));
    }).catch(() => {});
  }, [token]);

  useEffect(() => {
    let ws;
    let alive = true;
    let retry = 0;
    let timer = null;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const camQ = cam ? `&camera=${encodeURIComponent(cam)}` : '';
    function connect() {
      ws = new WebSocket(`${proto}://${location.host}/ws/stream?token=${token}${camQ}`);
      setStatus('connecting');
      ws.onopen = () => { if (alive) { retry = 0; setStatus('live'); setConnected(true); } };
      ws.onmessage = (ev) => {
        if (!alive) return;
        const msg = JSON.parse(ev.data);
        if (msg.type === 'ping') return;
        if (msg.type === 'frame') {
          setFrame({ jpeg: msg.jpeg, tracks: msg.tracks, poses: msg.poses, alerts: msg.alerts });
          const now = performance.now();
          const fr = fpsRef.current;
          if (now - fr.t > 1000) { fr.t = now; fr.n = 1; } else fr.n++;
          const persons = (msg.tracks || []).filter(t => t.label === 'person').length;
          setHud({ tracks: (msg.tracks || []).length, persons, vehicles: (msg.tracks || []).length - persons, fps: Math.round(fr.n), alerts: (msg.alerts || []).length });
          if (msg.alerts && msg.alerts.length) {
            const items = msg.alerts.map(a => ({ ...a, camera: a.camera || msg.camera, _id: a.timestamp + a.rule + (a.track_id || 0) }));
            setFeed(f => [...items.reverse(), ...f].slice(0, 40));
            setRecent(items);
          }
        }
      };
      ws.onclose = () => { if (alive) { setStatus('offline'); setConnected(false); retry++; timer = setTimeout(connect, Math.min(2000 * retry, 10000)); } };
      ws.onerror = () => { if (alive) ws.close(); };
    }
    connect();
    return () => { alive = false; if (timer) clearTimeout(timer); try { ws.close(); } catch (_) {} };
  }, [token, cam]);

  // paint frame + overlay once per incoming frame
  useEffect(() => {
    if (!frame || !canvasRef.current) return;
    const img = new Image();
    img.onload = () => {
      if (!canvasRef.current) return;
      const sevByTrack = {};
      for (const a of frame.alerts || []) if (a.track_id != null) sevByTrack[a.track_id] = a.severity;
      drawOverlay(canvasRef.current, img, img.naturalWidth, img.naturalHeight, frame.tracks, frame.poses, frame.alerts, sevByTrack);
    };
    img.src = 'data:image/jpeg;base64,' + frame.jpeg;
  }, [frame]);

  useEffect(() => {
    api(token).get('/api/alerts/recent?limit=30').then(r => setRecent(r.alerts || [])).catch(() => {});
  }, [token]);

  return (
    <div className="live-grid">
      <div className="stream-card">
        <div className="stream-head">
          <span className="cam">📷 {(cams.find(c => c.id === cam) || {}).name || cam || 'All cameras'}</span>
          <select value={cam} onChange={e => setCam(e.target.value)}
                  style={{ background: '#0d1526', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: 8, padding: '5px 8px', fontSize: 12 }}>
            {cams.map(c => <option key={c.id} value={c.id}>{c.id} — {c.name}</option>)}
            {cams.length > 1 && <option value="">all cameras</option>}
          </select>
          <span className="pill"><span className={'dot ' + (connected ? 'live' : 'idle')} />{status}</span>
          <span className="spacer" />
          <span style={{fontSize:11}}>frame {frame ? (frame.ts || 0).toFixed(1) + 's' : '—'}</span>
        </div>
        <div className="stream-body">
          <canvas ref={canvasRef} style={{width:'100%', height:'100%'}} />
          <div className="stream-status">LIVE • pose + tracking overlay</div>
        </div>
        <div className="hud-row">
          <span>PERSONS <b>{hud.persons}</b></span>
          <span>VEHICLES <b>{hud.vehicles}</b></span>
          <span>TRACKS <b>{hud.tracks}</b></span>
          <span>ACTIVE ALERTS <b>{hud.alerts}</b></span>
          <span>FPS <b>{hud.fps}</b></span>
        </div>
      </div>
      <div className="feed">
        <div className="feed-head">🚨 Live alert feed</div>
        <div className="feed-list">
          {feed.length === 0 && <div className="feed-empty">Waiting for alerts… (loitering, fight, fall, chase, trespass, crowd, anomaly)</div>}
          {feed.map((a, i) => (
            <div className="feed-item" key={a._id || i}>
              <span className="sev" style={{ background: SEV_COLORS[a.severity] || '#94a3b8' }} />
              <span className="msg">{a.message}</span>
              {a.camera && <span className="rule">{a.camera}</span>}
              <span className="rule">{a.rule}</span>
              <span className="ts">{a.timestamp.toFixed(1)}s</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ---------- Evidence tab ----------
function EvidenceTab({ token, role }) {
  const [rows, setRows] = useState(null);
  const [q, setQ] = useState('');
  const [rule, setRule] = useState('');
  const [sev, setSev] = useState('');
  const [cam, setCam] = useState('');       // Phase 8 M2: per-camera filter
  const [cams, setCams] = useState([]);
  const [sel, setSel] = useState(null);
  const [err, setErr] = useState('');
  const [clipUrl, setClipUrl] = useState(null);

  useEffect(() => {
    api(token).get('/api/status').then(d => setCams(d.cameras || [])).catch(() => {});
  }, [token]);

  const canDownload = role === 'operator' || role === 'analyst' || role === 'admin' || role === 'police';
  const canExport = role === 'analyst' || role === 'admin';
  const canNote = canExport;
  const canDelete = role === 'admin';

  // filters via ref so the debounced load always sees the latest values
  const filters = useRef({ q: '', rule: '', sev: '', cam: '' });
  filters.current = { q, rule, sev, cam };

  const load = useCallback(async () => {
    const f = filters.current;
    const params = new URLSearchParams();
    if (f.q) params.set('q', f.q);
    if (f.rule) params.set('rule', f.rule);
    if (f.sev) params.set('severity', f.sev);
    if (f.cam) params.set('camera', f.cam);
    params.set('limit', '200');
    try {
      const res = await api(token).get('/api/evidence?' + params.toString());
      setRows(res.events || []);
    } catch (ex) { setErr('Failed to load evidence'); }
  }, [token]);

  function debounce(fn, ms) {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  }
  const debouncedLoad = useRef(debounce(load, 400)).current;

  useEffect(() => { load(); }, [load, rule, sev, cam]);
  useEffect(() => {
    if (q === '') load(); else debouncedLoad();
  }, [q, load]);

  function closeModal() {
    if (clipUrl) { URL.revokeObjectURL(clipUrl); setClipUrl(null); }
    setSel(null);
  }
  async function openDetail(e) {
    if (clipUrl) { URL.revokeObjectURL(clipUrl); setClipUrl(null); }  // never show a stale clip
    try {
      const d = await api(token).get('/api/evidence/' + e.event_id);
      setSel(d);
    } catch (ex) { setErr('Could not load detail'); }
  }
  async function del(e) {
    if (!confirm('Delete evidence ' + e.event_id + '? This is audited.')) return;
    fetch('/api/evidence/' + e.event_id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } })
      .then(() => { closeModal(); load(); }).catch(() => setErr('Delete failed'));
  }
  async function expire() {
    if (!confirm('Run retention policy now (30 days)?')) return;
    fetch('/api/evidence/expire', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ max_age_days: 30 }) })
      .then(r => r.json()).then(r => { setErr('Expired ' + r.expired + ' events'); load(); });
  }
  async function exportZip() {
    const params = new URLSearchParams();
    const f = filters.current;
    if (f.q) params.set('q', f.q);
    if (f.rule) params.set('rule', f.rule);
    if (f.sev) params.set('severity', f.sev);
    if (f.cam) params.set('camera', f.cam);
    params.set('limit', '500');
    try {
      const r = await fetch('/api/evidence/export?' + params.toString(), { headers: { 'Authorization': 'Bearer ' + token } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const u = URL.createObjectURL(await r.blob());
      const a = document.createElement('a');
      a.href = u; a.download = 'bhairav_export.zip';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 5000);
      setErr('Exported ' + (f.q || f.rule || f.sev ? 'filtered' : 'latest') + ' results (zip)');
    } catch (_) { setErr('Export failed (analyst+ required).'); }
  }
  async function playClip(ev) {
    try {
      const r = await fetch('/api/evidence/' + ev.event_id + '/clip', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      if (clipUrl) URL.revokeObjectURL(clipUrl);
      setClipUrl(URL.createObjectURL(await r.blob()));
    } catch (_) { setErr('Clip unavailable (operator+ required).'); }
  }
  async function setStatus(ev, status) {
    try {
      const r = await fetch('/api/evidence/' + ev.event_id + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ status }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || 'HTTP ' + r.status);
      setSel(d); setErr('Status → ' + status);
    } catch (ex) { setErr(String(ex.message || ex)); }
  }
  async function addNote(ev) {
    const text = (document.getElementById('note-input') || {}).value || '';
    if (!text.trim()) return;
    try {
      const r = await fetch('/api/evidence/' + ev.event_id + '/notes', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ text }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || 'HTTP ' + r.status);
      document.getElementById('note-input').value = '';
      setSel(d);
    } catch (ex) { setErr(String(ex.message || ex)); }
  }

  return (
    <div>
      <div className="search-row">
        <input type="text" placeholder="Search message, rule or zone… (e.g. fight, plaza, fall)" value={q} onChange={e => setQ(e.target.value)} />
        <select value={rule} onChange={e => setRule(e.target.value)}>
          <option value="">all rules</option>
          {RULES.map(r => <option key={r} value={r}>{r}</option>)}
        </select>
        <select value={sev} onChange={e => setSev(e.target.value)}>
          <option value="">all severities</option>
          {['yellow','orange','red'].map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <select value={cam} onChange={e => setCam(e.target.value)}>
          <option value="">all cameras</option>
          {cams.map(c => <option key={c.id} value={c.id}>{c.id} — {c.name}</option>)}
        </select>
        {canExport && <button className="btn btn-ghost" onClick={exportZip}>📦 export zip</button>}
        {canDelete && <button className="btn btn-ghost" onClick={expire}>🧹 run retention</button>}
      </div>
      <form className="desc-search" onSubmit={search}>
        <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search by description — e.g. red shirt, tall"
               style={{flex:1, padding:'8px 12px', borderRadius:8, border:'1px solid #333', background:'#0a0a0a', color:'var(--fg)'}} />
        <button className="btn btn-primary" style={{width:'auto'}} type="submit">search</button>
      </form>
      {hits && (
        <div style={{marginTop:10, marginBottom:4, fontSize:13}}>
          <span className="muted">query: <b style={{color:'var(--fg)'}}>{hits.query}</b></span>
          {hits.colors.length > 0 && <span className="chip" style={{background:'#1e1b4b', color:'#a5b4fc', marginLeft:8}}>colors: {hits.colors.join(', ')}</span>}
          {hits.height && <span className="chip" style={{background:'#052e16', color:'var(--green)', marginLeft:8}}>height: {hits.height}</span>}
          <span className="chip" style={{background:'#1c1917', color:'#d6d3d1', marginLeft:8}}>{hits.results.length} match(es)</span>
          {hits.results.length === 0 && <span className="muted" style={{marginLeft:8}}>no subjects match this description</span>}
        </div>
      )}
      {hits && hits.results.length > 0 && (
        <div className="sighting-grid" style={{marginTop:6}}>
          {hits.results.map(h => (
            <div key={h.subject.id} className="sighting" style={{cursor:'pointer'}} onClick={() => openTrail(h.subject.id)}>
              <div style={{fontSize:12}}><b style={{color: h.subject.auto ? '#c4b5fd' : 'var(--green)'}}>{h.subject.name}</b></div>
              <div className="muted" style={{fontSize:11}}>{h.subject.id} · score {h.score}</div>
              <div style={{fontSize:11, marginTop:2}}>{descrText(h.subject.description)}</div>
            </div>
          ))}
        </div>
      )}
      {err && <div className="err">{err}</div>}
      {rows === null ? <div className="loading">Loading evidence…</div> :
        rows.length === 0 ? <div className="feed-empty">No evidence matches.</div> :
        <>
          <div className="count">{rows.length} events</div>
          <div className="ev-grid">
            {rows.map(e => (
              <div className="ev-card" key={e.event_id} onClick={() => openDetail(e)}>
                <SnapImg token={token} eventId={e.event_id} />
                <div className="ev-body">
                  <div className="ev-top">
                    <span className="sev-badge" style={sevStyle(e.severity)}>{e.severity.toUpperCase()}</span>
                    <span className="ev-rule">{e.rule}</span>
                  </div>
                  <div className="ev-meta">t={e.start_ts.toFixed(1)}s · {e.frame_count} frames · {e.camera}</div>
                  <div className="ev-msg">{e.message}</div>
                  <div className="ev-flag">{e.blurred ? '🫥 face-blur' : ''}{e.encrypted ? ' 🔒 encrypted' : ''}</div>
                </div>
              </div>
            ))}
          </div>
        </>}
      {sel && (
        <div className="modal-back" onClick={closeModal}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-head">
              <span className="title">{sel.rule.toUpperCase()} — {sel.event_id}</span>
              <span className="sev-badge" style={sevStyle(sel.severity)}>{sel.severity.toUpperCase()}</span>
              <button className="modal-close" onClick={closeModal}>×</button>
            </div>
            <div className="modal-body">
              <SnapImg token={token} eventId={sel.event_id} />
              <div className="meta-grid">
                <div className="meta-cell"><div className="k">Rule</div><div className="v">{sel.rule}</div></div>
                <div className="meta-cell"><div className="k">Severity</div><div className="v">{sel.severity}</div></div>
                <div className="meta-cell"><div className="k">Zone</div><div className="v">{sel.zone || '—'}</div></div>
                <div className="meta-cell"><div className="k">Track</div><div className="v">{sel.track_id ?? '—'}</div></div>
                <div className="meta-cell"><div className="k">Confidence</div><div className="v">{sel.confidence}</div></div>
                <div className="meta-cell"><div className="k">Window</div><div className="v">{sel.start_ts.toFixed(1)}s → {sel.end_ts.toFixed(1)}s</div></div>
                <div className="meta-cell"><div className="k">Frames</div><div className="v">{sel.frame_count}</div></div>
                <div className="meta-cell"><div className="k">Privacy</div><div className="v">{sel.blurred ? '🫥 face-blur' : 'none'}{sel.encrypted ? ' 🔒' : ''}</div></div>
              </div>
              <div className="modal-actions">
        {canDownload && (
          <button className="btn btn-primary" onClick={() => playClip(sel)}>▶ Play clip</button>
        )}
        {canDownload && (
          <button className="btn btn-ghost" onClick={() => downloadClip(token, sel)}>⬇ Download mp4</button>
        )}
        {!canDownload && <span className="pill">clip playback requires operator+</span>}
        {clipUrl && <video controls autoPlay src={clipUrl} style={{marginTop:14}} />}
        {canDelete && <button className="btn btn-ghost" onClick={() => del(sel)}>🗑 Delete evidence</button>}
      </div>
      {canDownload && (
        <div className="note-box">
          <div className="meta-cell"><div className="k">Status</div><div className="v">
            <select value={sel.status || 'new'} onChange={e => setStatus(sel, e.target.value)}>
              <option value="new">new</option>
              <option value="acknowledged">acknowledged</option>
              {(role === 'analyst' || role === 'admin') ? <option value="resolved">resolved</option> : null}
            </select>
          </div></div>
          {canNote && (
            <div style={{display:'flex', gap:8, flex:1, minWidth:200}}>

          {(sel.notes || []).map((n, i) => (

          ))}

      )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Dispatch tab (Phase 10 M4: field-officer alert feed) ----------
function DispatchTab({ token }) {
  const [items, setItems] = useState([]);
  const [status, setStatus] = useState('connecting');
  useEffect(() => {
    let ws, alive = true, retry = 0, timer = null;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    function connect() {
      ws = new WebSocket(`${proto}://${location.host}/ws/field?token=${encodeURIComponent(token)}`);
      setStatus('connecting');
      ws.onopen = () => { if (alive) { retry = 0; setStatus('live'); } };
      ws.onmessage = (ev) => {
        if (!alive) return;
        const msg = JSON.parse(ev.data);
        if (msg.type === 'ping') return;
        if (msg.type === 'alert') {
          const a = msg.alert || {};
          const id = (a.timestamp || 0) + '|' + (a.rule || '') + '|' + (a.track_id || 0) + '|' + Math.random();
          setItems(it => [{ ...a, _id: id }, ...it].slice(0, 120));
        }
      };
      ws.onclose = () => { if (alive) { setStatus('offline'); retry++; timer = setTimeout(connect, Math.min(2000 * retry, 10000)); } };
      ws.onerror = () => { if (alive) ws.close(); };
    }
    connect();
    return () => { alive = false; if (timer) clearTimeout(timer); try { ws.close(); } catch (_) {} };
  }, [token]);

  const sevColor = s => ({ red: '#ef4444', orange: '#f97316', yellow: '#eab308', green: '#22c55e' }[s] || '#94a3b8');
  const sevOrder = { red: 0, orange: 1, yellow: 2, green: 3 };
  const sorted = [...items].sort((a, b) => (sevOrder[a.severity] ?? 9) - (sevOrder[b.severity] ?? 9));

  return (
    <div>
      <div className="feed-head" style={{ display: 'flex', alignItems: 'center' }}>
        <span>📟 Field dispatch — live alert push</span>
        <span className="spacer" />
        <span className="pill"><span className={'dot ' + (status === 'live' ? 'live' : 'dead')} />{status}</span>
      </div>
      <div className="feed" style={{ marginTop: 10 }}>
        <div className="feed-list">
          {items.length === 0
            ? <div className="feed-empty">Waiting for alerts… (red/orange/yellow pushes appear here instantly)</div>
            : sorted.map((a) => (
                <div key={a._id} className="feed-item" style={{ borderLeft: `4px solid ${sevColor(a.severity)}` }}>
                  <span className="sev" style={{ background: sevColor(a.severity) }} />

function Spark({ name, points, color }) {
  if (!points || points.length < 2) return <div className="muted" style={{fontSize: 12}}>collecting…</div>;
  const W = 260, H = 60, pad = 4;
  const vals = points.map(p => p.v);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const rng = (hi - lo) || 1;
  const step = W / (points.length - 1);
  const path = points.map((p, i) => {
    const x = pad + i * step;
    const y = H - pad - ((p.v - lo) / rng) * (H - 2 * pad);
    return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
  }).join(' ');
  return (
    <svg width={W} height={H} style={{background:'rgba(0,0,0,.25)', borderRadius:6}}>
      <path d={path} fill="none" stroke={color || '#4cc38a'} strokeWidth={1.6} />
      <text x={pad + 2} y={12} fill="#9aa4b2" fontSize={10}>{name}</text>
    </svg>
  );
}

function fileToB64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

const EXAMPLES = [
  'show red fight alerts in the plaza last 7 days',
  'plate MH12AB1234 seen on CAM-02 yesterday',

  'who logged in today',

function AssistantTab({ token }) {
  const [q, setQ] = useState('');
  const [res, setRes] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  async function run(query) {
    const text = (query !== undefined ? query : q).trim();
    if (!text) return;
    setBusy(true); setErr(''); setRes(null);
    try {
      const r = await fetch('/api/assistant/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ query: text }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || 'HTTP ' + r.status);
      setRes(d);
    } catch (ex) { setErr(String(ex.message || ex)); }
    finally { setBusy(false); }
  }

  return (
    <div>
      <div className="search-row">
        <input type="text" placeholder="Ask in plain English… e.g. red fight alerts in the plaza last 7 days"
               value={q} onChange={e => setQ(e.target.value)}
               onKeyDown={e => { if (e.key === 'Enter') run(); }} />
        <button className="btn btn-primary" style={{ width: 'auto' }} disabled={busy} onClick={() => run()}>
          {busy ? 'Thinking…' : '🤖 Ask'}
        </button>
      </div>
      <div className="search-row">
        {EXAMPLES.map((ex, i) => (
          <button key={i} className="pill" style={{ cursor: 'pointer' }} onClick={() => { setQ(ex); run(ex); }}>{ex}</button>
        ))}
      </div>
      {err && <div className="err">{err}</div>}
      {res && (
        <>
          {(res.warnings || []).map((w, i) => <div key={i} className="err">{w}</div>)}

            <div className="search-row">
              <span className="pill">🔎 understood:</span>
              {res.plan.map((p, i) => <span key={i} className="chip" style={{ background: '#0d1526', color: 'var(--cyan)', border: '1px solid var(--border)' }}>{p}</span>)}
            </div>
          )}
          <div className="count">{res.events.length} matching events · {res.audit.length} audit entries{res.plate_reads.length ? ` · ${res.plate_reads.length} plate read(s)` : ''}</div>

                  <div className="ev-msg">{e.message}</div>
                </div>
              </div>
            ))}
          </div>
          {res.events.length === 0 && <div className="feed-empty">No evidence matches.</div>}
          {res.plate_reads.length > 0 && (
            <div className="stat-col">
              <h3>Plate reads</h3>
              <div className="result-list">
                {res.plate_reads.map((r, i) => (

function descrText(d) {
  if (!d) return '';
  const cols = (d.colors || []).map(c => c.name).join(', ');
  const h = d.height_class || '';
  return (cols ? cols + (h ? ' · ' : '') : '') + h || 'no description';
}

// ---------- Phase 9 M5: read-only public monitor (privacy-blurred) ----------
// No login. The token comes from the URL (?public=<token>) and is only used
// to open the /api/public/stream socket, which serves head-blurred frames.
function PublicView() {
  const token = new URLSearchParams(location.search).get('public') || '';
  const [cameras, setCameras] = useState([]);
  const [frames, setFrames] = useState({});
  const [status, setStatus] = useState('connecting');
  const [hud, setHud] = useState({ frames: 0, alerts: 0 });
  const lastHud = useRef({ n: 0, t: 0 });

  useEffect(() => {
    let alive = true;
    fetch('/api/public/info').then(r => r.json()).then(d => {
      if (alive) setCameras(d.cameras || []);
    }).catch(() => {});
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    let ws;
    let retry = 0;
    let timer = null;
    function connect() {
      ws = new WebSocket(`${proto}://${location.host}/api/public/stream?token=${encodeURIComponent(token)}`);
      setStatus('connecting');
      ws.onopen = () => { if (alive) { retry = 0; setStatus('live'); } };
      ws.onmessage = (ev) => {
        if (!alive) return;
        const msg = JSON.parse(ev.data);
        if (msg.type === 'ping') return;
        if (msg.type === 'frame' && msg.jpeg) {
          setFrames(f => ({ ...f, [msg.camera || 'all']: { jpeg: msg.jpeg, ts: msg.ts } }));
          const h = lastHud.current;
          if (performance.now() - h.t > 1000) { h.t = performance.now(); h.n = 1; }
          else h.n++;
          setHud({ frames: h.n, alerts: 0 });
        }
      };
      ws.onclose = () => { if (alive) { setStatus('offline'); retry++; timer = setTimeout(connect, Math.min(2000 * retry, 10000)); } };
      ws.onerror = () => { if (alive) ws.close(); };
    }
    connect();
    return () => { alive = false; if (timer) clearTimeout(timer); try { ws.close(); } catch (_) {} };
  }, [token]);

  const cols = cameras.length ? cameras : ['all'];
  return (
    <div className="public-wrap">
      <div className="public-head">
        <div className="brand">🛰 BHAIRAV <span>Public Monitor</span></div>
        <div className="spacer" />
        <span className="pill"><span className={'dot ' + (status === 'live' ? 'live' : 'dead')} />{status}</span>
        <span className="pill" style={{background:'#1c1917', color:'#d6d3d1'}}>privacy-blurred · read-only</span>
        <a className="btn btn-ghost" style={{textDecoration:'none'}} href="/">Command center</a>
      </div>
      <main>
        <div className="public-grid" style={{gridTemplateColumns: 'repeat(auto-fit, minmax(360px, 1fr))'}}>
          {cols.map(c => {
            const f = frames[c];
            return (
              <div key={c} className="public-card">
                <div className="public-cam">{c === 'all' ? 'all cameras' : c}</div>
                {f
                  ? <img src={'data:image/jpeg;base64,' + f.jpeg} alt={'camera ' + c} />
                  : <div className="sighting-thumb" style={{height: 210}} />}
                <div className="muted" style={{fontSize:11, marginTop:6}}>
                  {f ? 'updated ' + new Date(f.ts * 1000).toLocaleTimeString() : 'waiting for frames…'}
                </div>
              </div>
            );
          })}
        </div>
        <div className="muted" style={{marginTop:18, fontSize:12, textAlign:'center'}}>
          This view is privacy-stripped: faces are blurred and no tracking, pose or alert data is shared.
        </div>
      </main>
    </div>
  );
}

        )
      ),
      React.createElement('div', {className: 'analytics-panel', style: {marginBottom: 16}},
        React.createElement('h3', null, 'Spatial Heatmap (' + (heatmap.points || 0) + ' samples)'),
        grid.length > 0 && React.createElement('div', {className: 'heatmap-grid', style: {gridTemplateColumns: 'repeat(' + gridW + ', 1fr)'}},
          grid.flat().map(function(v, i) {
            return React.createElement('div', {key: i, className: 'heatmap-cell', style: {
              background: v > 0
                ? 'rgba(255, ' + Math.round(255 * (1 - v)) + ', 0, ' + Math.min(1, v * 0.8 + 0.1) + ')'
                : 'transparent'}});
          })
        ),
        grid.length === 0 && React.createElement('div', {style: {fontSize:13, color:'var(--muted)'}}, 'No heatmap data yet')
      ),
      React.createElement('div', {className: 'analytics-row'},
        React.createElement('div', {className: 'analytics-panel'},
          React.createElement('h3', null, 'By Zone'),
          Object.entries(trends.by_zone || {}).map(function(entry) {
            var zone = entry[0], n = entry[1];
            return React.createElement('div', {key: zone, className: 'trend-bar'},
              React.createElement('span', {style: {width:100, fontSize:12}}, zone),
              React.createElement('div', {className: 'bar', style: {width: Math.min(120, n * 4)}}),
              React.createElement('span', null, n));
          }),
          Object.keys(trends.by_zone || {}).length === 0 && React.createElement('div', {style: {fontSize:13, color:'var(--muted)'}}, 'No zone data')
        ),
        React.createElement('div', {className: 'analytics-panel'},
          React.createElement('h3', null, 'By Camera'),
          Object.entries(trends.by_camera || {}).map(function(entry) {
            var cam = entry[0], n = entry[1];
            return React.createElement('div', {key: cam, className: 'trend-bar'},
              React.createElement('span', {style: {width:100, fontSize:12}}, cam),
              React.createElement('div', {className: 'bar', style: {width: Math.min(120, n * 4)}}),
              React.createElement('span', null, n));
          }),
          Object.keys(trends.by_camera || {}).length === 0 && React.createElement('div', {style: {fontSize:13, color:'var(--muted)'}}, 'No camera data')
        )
      )
    )
  );
}

function ApiDocsTab() {
  return (
    React.createElement('div', {style: {padding: '20px'}},
      React.createElement('iframe', {
        src: '/api-docs.html',
        style: {width: '100%', height: 'calc(100vh - 120px)', border: '1px solid #21262d', borderRadius: '12px'},
        title: 'API Documentation'
      })
    )
  );
}

function App() {
  const [auth, setAuth] = useState(() => {
    try {
      const s = localStorage.getItem('bhairav-auth');
      return s ? JSON.parse(s) : null;
    } catch (_) { return null; }
  });
  const [tab, setTab] = useState('live');

  if (new URLSearchParams(location.search).get('public')) {
    return <PublicView />;
  }

  if (!auth || !auth.token) {
    return <Login onLogin={(token, role, username) => {
      const a = { token, role, username };
      localStorage.setItem('bhairav-auth', JSON.stringify(a));
      setAuth(a); setTab('live');
    }} />;
  }

  const tabs = [
    { id: 'live', label: '📡 Live' },
    { id: 'evidence', label: '🗂 Evidence' },
    { id: 'status', label: '📊 Status' },
  ];
  tabs.push({ id: 'dispatch', label: '📟 Dispatch' });
  const readOnlyExtra = auth.role === 'police';
  if (auth.role === 'analyst' || auth.role === 'admin' || readOnlyExtra) tabs.push({ id: 'search', label: '🔎 Search' });
  if (auth.role === 'analyst' || auth.role === 'admin') tabs.push({ id: 'assistant', label: '🤖 Assistant' });
  if (auth.role === 'analyst' || auth.role === 'admin') tabs.push({ id: 'vehicles', label: '🚗 Vehicles' });
  if (auth.role === 'analyst' || auth.role === 'admin' || auth.role === 'police') tabs.push({ id: 'reid', label: '👤 Re-ID' });
  if (auth.role === 'analyst' || auth.role === 'admin') tabs.push({ id: 'audit', label: '🛡 Audit' });

  if (auth.role === 'analyst' || auth.role === 'admin') tabs.push({ id: 'analytics', label: '📈 Analytics' });
  tabs.push({ id: 'map', label: '🗺 Map' });
  if (auth.role === 'admin') tabs.push({ id: 'users', label: '👥 Users' });
  tabs.push({ id: 'apidocs', label: '📖 API Docs' });

  return (
    <>
      <div className="topbar">
        <div className="brand">🛰 BHAIRAV <span>Command Center</span></div>
        <div className="tabs">
          {tabs.map(t => (
            <button key={t.id} className={'tab' + (tab === t.id ? ' active' : '')}
                    onClick={() => setTab(t.id)}>{t.label}</button>
          ))}
        </div>
        <div className="spacer" />
        <span className="pill"><span className="dot live" />server connected</span>
        <span className="user">{auth.username} · <b>{auth.role}</b></span>
        <button className="logout" onClick={() => { localStorage.removeItem('bhairav-auth'); setAuth(null); }}>Sign out</button>
      </div>
      <main>
        {tab === 'live' && <LiveTab token={auth.token} />}
        {tab === 'evidence' && <EvidenceTab token={auth.token} role={auth.role} />}
        {tab === 'status' && <StatusTab token={auth.token} role={auth.role} />}
        {tab === 'dispatch' && <DispatchTab token={auth.token} />}
        {tab === 'assistant' && <AssistantTab token={auth.token} />}
        {tab === 'search' && <SearchTab token={auth.token} role={auth.role} />}
        {tab === 'vehicles' && <VehiclesTab token={auth.token} role={auth.role} />}
        {tab === 'reid' && <ReidTab token={auth.token} role={auth.role} />}
        {tab === 'audit' && <AuditTab token={auth.token} />}
        {tab === 'analytics' && <AnalyticsTab token={auth.token} />}
        {tab === 'map' && <MapTab token={auth.token} />}
        {tab === 'apidocs' && <ApiDocsTab />}
        {tab === 'users' && <UsersTab token={auth.token} me={auth.username} />}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
