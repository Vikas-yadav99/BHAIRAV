<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Report Incident — BHAIRAV</title>
<style>
:root {
  --bg: #0b1120; --panel: #0f172a; --border: #1e293b;
  --text: #e2e8f0; --muted: #64748b; --dim: #94a3b8;
  --green: #22c55e; --yellow: #eab308; --orange: #f97316; --red: #ef4444; --cyan: #22d3ee;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; min-height: 100dvh; }
.container { max-width: 480px; margin: 0 auto; padding: 16px; }
.header { text-align: center; padding: 24px 0 16px; }
.header h1 { font-size: 20px; margin-bottom: 4px; }
.header h1 span { color: var(--cyan); }
.header .sub { color: var(--muted); font-size: 13px; }
.map-wrap { width: 100%; height: 200px; background: #0a0f1a; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: relative; margin-bottom: 16px; }
.map-wrap canvas { width: 100%; height: 100%; }
.map-pin { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%); font-size: 28px; pointer-events: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
.map-hint { position: absolute; bottom: 8px; left: 8px; background: rgba(15,23,42,.85); padding: 4px 10px; border-radius: 6px; font-size: 10px; color: var(--muted); }
.gps-status { position: absolute; top: 8px; right: 8px; display: flex; align-items: center; gap: 6px; background: rgba(15,23,42,.85); padding: 4px 10px; border-radius: 6px; font-size: 10px; color: var(--muted); }
.gps-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.gps-dot.active { background: var(--green); }
.field { margin-bottom: 16px; }
.field label { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; background: #0d1526; color: var(--text); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; font-size: 15px; font-family: inherit;
}
.field textarea { min-height: 80px; resize: vertical; }
.field input::placeholder, .field textarea::placeholder { color: #334155; }
.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cat-btn { background: #0d1526; border: 2px solid var(--border); border-radius: 10px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all .15s; }
.cat-btn:hover { border-color: #334155; }
.cat-btn.selected { border-color: var(--cyan); background: rgba(34,211,238,.08); }
.cat-btn .emoji { font-size: 24px; display: block; margin-bottom: 4px; }
.cat-btn .label { font-size: 11px; color: var(--muted); }
.cat-btn.selected .label { color: var(--cyan); }
.sev-row { display: flex; gap: 8px; }
.sev-btn { flex: 1; border: 2px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; transition: all .15s; background: #0d1526; }
.sev-btn:hover { border-color: #334155; }
.sev-btn.selected { border-color: var(--cyan); background: rgba(34,211,238,.08); }
.sev-btn .level { font-size: 18px; font-weight: 800; }
.sev-btn .desc { font-size: 10px; color: var(--muted); margin-top: 2px; }
.sev-btn.s1 .level { color: var(--green); }
.sev-btn.s2 .level { color: var(--yellow); }
.sev-btn.s3 .level { color: var(--orange); }
.sev-btn.s4 .level { color: var(--red); }
.btn { border: none; border-radius: 12px; padding: 16px 20px; font-weight: 700; font-size: 16px; width: 100%; cursor: pointer; }
.btn-primary { background: var(--cyan); color: #06222b; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.result { text-align: center; padding: 32px 16px; }
.result .icon { font-size: 56px; margin-bottom: 12px; }
.result h2 { font-size: 20px; margin-bottom: 8px; }
.result .id { font-size: 14px; color: var(--cyan); font-family: monospace; margin-bottom: 4px; }
.result .msg { color: var(--muted); font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
.nearby { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px; }
.nearby h3 { font-size: 14px; color: var(--dim); margin-bottom: 8px; }
.nearby-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.nearby-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.nearby-item .info { flex: 1; }
.nearby-item .title { font-weight: 600; }
.nearby-item .meta { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
